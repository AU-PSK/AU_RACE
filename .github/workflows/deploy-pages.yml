name: Deploy browser game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify game server URL
        run: |
          if [ -z "$VITE_GAME_SERVER_URL" ]; then
            echo "Set the VITE_GAME_SERVER_URL repository variable before deploying."
            exit 1
          fi
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
      - name: Build client
        run: npm run build --workspace client
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
